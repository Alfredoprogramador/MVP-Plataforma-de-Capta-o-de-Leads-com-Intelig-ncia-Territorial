version: "3.9"

services:
  backend:
    build: ./backend
    container_name: lead-platform-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - db_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/leads.db

  frontend:
    image: nginx:alpine
    container_name: lead-platform-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  db_data:
